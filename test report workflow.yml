            \nRÀNG BUỘC TUYỆT ĐỐI:\n- KHÔNG viết bất kỳ con số nào trong output.\n\
            - Nếu cần nhắc đến số liệu, dùng cách diễn đạt định tính:\n  \"phần lớn\"\
            , \"một số ít\", \"còn tồn đọng\", \"chưa đạt ngưỡng\".\n- KHÔNG tự tính\
            \ toán bất cứ gì.\n- KHÔNG tự quyết GỒ/NO-GO. Nếu cần khuyến nghị, ghi\
            \ rõ:\n  \"ĐỀ XUẤT - cho quyết định của người phụ trách\".\n\nCHỈ VIẾT\
            \ 3 PHẦN:\n1. Nhận xét tổng quan về chất lượng\n2. Điểm đáng lo ngại nhất\n\
            3. Rủi ro còn tồn đọng nhưng chưa phát hành\n\nNếu thiếu thông tin để\
            \ nhận xét -> ghi \"[can bo sung]\".\n\n"

            - Bảng Traceability: | AC/BR | Test Case ID | COVERED hay GAP |

            - Tự chấm 1-10 cho chất lượng bộ test case

            - Nêu 3 vấn đề nghiêm trọng nhất


            ĐỊNH DẠNG BẮT BUỘC (để không vượt token budget):

            - Mỗi vấn đề chỉ 1 dòng: "- [ID liên quan] mô tả ngắn (tối đa 20 từ) ->
            đề xuất (tối đa 10 từ)"

            - KHÔNG viết đoạn văn dài giải thích lại ngữ cảnh đã biết.

            - Nếu nhiều test case cùng mắc 1 loại lỗi, gộp chung 1 dòng, liệt kê các

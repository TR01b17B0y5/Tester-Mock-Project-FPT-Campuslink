    - data:
        code: "import json\n\ndef to_object(value):\n    if isinstance(value, str):\n\
          \        return json.loads(value)\n    return value or {}\n\ndef compact_line(tc:\
          \ dict) -> str:\n    tc_id = tc.get(\"test_case_id\", \"N/A\")\n    priority\
          \ = tc.get(\"priority\", \"N/A\")\n    sources = \",\".join(tc.get(\"source_ids\"\
          , []) or [])\n    risks = \",\".join(tc.get(\"risk_ids\", []) or [])\n \
          \   title = tc.get(\"title\", \"\")\n    steps = tc.get(\"steps\", []) or\
          \ []\n    expected = \" ; \".join(s.get(\"expected_result\", \"\") for s\
          \ in steps)\n    line = f\"{tc_id} | P={priority} | src=[{sources}] | risk=[{risks}]\
          \ | {title} :: exp: {expected}\"\n    # hard cap per line so a single verbose\
          \ test case cannot blow up the budget\n    if len(line) > 260:\n       \
          \ line = line[:257] + \"...\"\n    return line\n\ndef main(risk_result,\
          \ test_result, coverage_threshold: float) -> dict:\n    risk_data = to_object(risk_result)\n\
          \    test_data = to_object(test_result)\n\n    sources = risk_data.get(\"\
          coverage_sources\", [])\n    test_cases = test_data.get(\"test_cases\",\
          \ [])\n\n    expected_ids = {\n        item.get(\"source_id\")\n       \
          \ for item in sources\n        if item.get(\"source_id\")\n    }\n\n   \
          \ referenced_ids = set()\n    for test_case in test_cases:\n        referenced_ids.update(test_case.get(\"\
          source_ids\", []))\n\n    covered_ids = sorted(expected_ids.intersection(referenced_ids))\n\
          \    uncovered_ids = sorted(expected_ids.difference(referenced_ids))\n \
          \   invalid_ids = sorted(referenced_ids.difference(expected_ids))\n\n  \
          \  coverage_rate = (\n        round((len(covered_ids) / len(expected_ids))\
          \ * 100, 2)\n        if expected_ids else 100\n    )\n\n    compact_testcases\
          \ = \"\\n\".join(compact_line(tc) for tc in test_cases)\n\n    return {\n\
          \        \"coverage_rate\": coverage_rate,\n        \"coverage_pass\": coverage_rate\
          \ >= float(coverage_threshold),\n        \"covered_source_ids\": covered_ids,\n\
          \        \"uncovered_source_ids\": uncovered_ids,\n        \"invalid_source_ids\"\
          : invalid_ids,\n        \"compact_testcases\": compact_testcases,\n    \
          \    \"test_case_count\": len(test_cases)\n    }"
        code_language: python3
